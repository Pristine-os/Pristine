# Continuous integration for Pristine OS (app lives in pristine-os/).
#
# Runs on a standard GitHub-hosted runner (free for public repositories).
# Uses no repository secrets and never touches Supabase or any shared
# database: migrations and integration tests run against a disposable
# PostgreSQL service container that exists only for this job, with fake
# credentials.
name: CI

on:
  pull_request:
    branches: [feature/database]
    paths:
      - "pristine-os/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [feature/database]
    paths:
      - "pristine-os/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

# One run per PR (or per pushed branch); a newer commit cancels the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Validate, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: pristine-os

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-not-a-secret
          POSTGRES_DB: pristine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d pristine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Fake, job-local credentials for the disposable service container
      # above. The integration tests refuse any database that isn't on
      # localhost with "test" in its name.
      TEST_DATABASE_URL: postgresql://ci:ci-not-a-secret@localhost:5432/pristine_test
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pristine-os/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Apply migrations to the disposable database
        run: DATABASE_URL="$TEST_DATABASE_URL" npx prisma migrate deploy

      - name: Check schema matches migrations
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" npx prisma migrate diff \
            --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Run tests
        run: npx vitest run --reporter=default --reporter=json --outputFile=vitest-results.json

      # Integration tests skip themselves when no test database is
      # available, which Vitest still reports as success. Fail instead.
      - name: Require that no tests were skipped
        run: |
          node -e '
            const r = require("./vitest-results.json");
            const skipped = r.numPendingTests + r.numTodoTests;
            console.log(`total=${r.numTotalTests} passed=${r.numPassedTests} failed=${r.numFailedTests} skipped=${skipped}`);
            if (r.numTotalTests === 0 || skipped > 0 || r.numPassedTests !== r.numTotalTests) process.exit(1);
          '

      - name: Production build
        run: npx next build
